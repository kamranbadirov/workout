<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KINETIC — Builder</title>
    <link rel="stylesheet" href="style.css" />
    <script src="exercises.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="back-btn">←</a>
      <div class="logo">KINETIC</div>
      <div id="clock">--:--</div>
    </header>

    <div class="container">

      <!-- SESSION (top) -->
      <div class="session-divider">YOUR SESSION</div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="builder-prog-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="builder-prog-text">0 / 0 done</div>
      </div>

      <div id="session-list">
        <div class="empty-session">no exercises yet — search below to add</div>
      </div>

      <button class="reset-btn" onclick="resetBuilderDone()">↺ reset session</button>

      <!-- SEARCH (below session) -->
      <div class="search-section">
        <div class="filter-pills" id="filter-pills">
          <div class="filter-pill active" data-filter="All">All</div>
          <div class="filter-pill" data-filter="Chest">Chest</div>
          <div class="filter-pill" data-filter="Back">Back</div>
          <div class="filter-pill" data-filter="Shoulders">Shoulders</div>
          <div class="filter-pill" data-filter="Arms">Arms</div>
          <div class="filter-pill" data-filter="Legs">Legs</div>
          <div class="filter-pill" data-filter="Core">Core</div>
          <div class="filter-pill" data-filter="Other">Other</div>
        </div>

        <div class="search-wrap">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="search exercises..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>

        <div id="search-results" class="search-results"></div>
      </div>

    </div>

    <script src="builder.js"></script>
  </body>
</html>

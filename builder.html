<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KINETIC — Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <script src="exercises.js"></script>
    <link rel="icon" type="image/x-icon" href="kinetic.png" />

  </head>
  <body>
    <header>
      <a href="index.html" class="back-btn">←</a>
      <div class="logo">KINETIC</div>
      <div id="clock">--:--</div>
    </header>

    <div class="container">

      <!-- SESSION (top) -->
      <div class="session-divider">YOUR SESSION</div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="builder-prog-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="builder-prog-text">0 / 0 done</div>
      </div>

      <div id="session-list">
        <div class="empty-session">no exercises yet — search below to add</div>
      </div>

      <button class="reset-btn" onclick="resetBuilderDone()">↺ reset session</button>

      <!-- SEARCH (below session) -->
      <div class="search-section">
        <div class="filter-pills" id="filter-pills">
          <button type="button" class="filter-pill active" data-filter="All">All</button>
          <button type="button" class="filter-pill" data-filter="Chest">Chest</button>
          <button type="button" class="filter-pill" data-filter="Back">Back</button>
          <button type="button" class="filter-pill" data-filter="Shoulders">Shoulders</button>
          <button type="button" class="filter-pill" data-filter="Arms">Arms</button>
          <button type="button" class="filter-pill" data-filter="Legs">Legs</button>
          <button type="button" class="filter-pill" data-filter="Core">Core</button>
          <button type="button" class="filter-pill" data-filter="Full">Full Body</button>
          <button type="button" class="filter-pill" data-filter="Other">Other</button>
        </div>

        <div class="search-wrap">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="search exercises..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>

        <div id="search-results" class="search-results"></div>
      </div>

    </div>

    <button class="contact-btn" onclick="openContact()">contact</button>
    <div class="contact-overlay" id="contact-overlay" onclick="closeContact(event)">
      <div class="contact-modal">
        <div class="contact-header">
          <span class="contact-title">Get in touch</span>
          <button class="contact-close" onclick="closeContact()">×</button>
        </div>
        <form id="contact-form" onsubmit="submitContact(event)">
          <input type="hidden" name="access_key" value="8ed04ea0-6265-4629-af50-b87884f7a27f">
          <input type="hidden" name="subject" value="KINETIC — Contact">
          <input class="contact-input" type="text"  name="name"    placeholder="your name"  required autocomplete="off" />
          <input class="contact-input" type="email" name="email"   placeholder="your email" required autocomplete="off" />
          <textarea class="contact-input contact-textarea" name="message" placeholder="message" required></textarea>
          <button class="contact-submit" type="submit">send →</button>
        </form>
        <div class="contact-success" id="contact-success">message sent ✓</div>
      </div>
    </div>

    <script src="builder.js"></script>
    <script src="contact.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme-things.css" />
    <link rel="stylesheet" href="theme-gentler.css" />
    <script src="theme.js"></script>
    <link rel="icon" type="image/x-icon" href="kinetic.png" />

  </head>
  <body>
    <header>
      <a href="index.html" class="back-btn">←</a>
      <button type="button" class="logo" id="app-title" data-mode-toggle title="Toggle dark mode">Kinetic</button>
      <div class="header-end">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-option="gentler">Gentler</button>
          <button type="button" data-theme-option="kinetic">Kinetic</button>
          <button type="button" data-theme-option="things">Things</button>
        </div>
        <div id="clock">--:--</div>
      </div>
    </header>

    <div class="container">
      <div class="slot-label" id="slot-label">detecting slot...</div>
      <div class="slot-title" id="slot-title">—</div>

      <div class="tabs" id="tab-container"></div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="prog-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="prog-text">0 / 0 done</div>
      </div>

      <div id="exercise-list"></div>

      <div id="avoid-section"></div>

      <button class="reset-btn" onclick="resetDone()">Reset session</button>
    </div>

    <button class="contact-btn" onclick="openContact()">Contact</button>
    <div class="contact-overlay" id="contact-overlay" onclick="closeContact(event)">
      <div class="contact-modal">
        <div class="contact-header">
          <span class="contact-title">Get in touch</span>
          <button class="contact-close" onclick="closeContact()">×</button>
        </div>
        <form id="contact-form" onsubmit="submitContact(event)">
          <input type="hidden" name="access_key" value="8ed04ea0-6265-4629-af50-b87884f7a27f">
          <input type="hidden" name="subject" value="KINETIC — Contact">
          <input class="contact-input" type="text"  name="name"    placeholder="your name"  required autocomplete="off" />
          <input class="contact-input" type="email" name="email"   placeholder="your email" required autocomplete="off" />
          <textarea class="contact-input contact-textarea" name="message" placeholder="message" required></textarea>
          <button class="contact-submit" type="submit">send →</button>
        </form>
        <div class="contact-success" id="contact-success">message sent ✓</div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="contact.js"></script>
  </body>
</html>

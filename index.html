<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme-things.css" />
    <link rel="stylesheet" href="theme-gentler.css" />
    <script src="theme.js"></script>
    <link rel="icon" type="image/x-icon" href="kinetic.png" />
  </head>
  <body class="landing">
    <header>
      <button type="button" class="logo" data-mode-toggle title="Toggle dark mode">Kinetic</button>
      <div class="header-end">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-option="gentler">Gentler</button>
          <button type="button" data-theme-option="kinetic">Kinetic</button>
          <button type="button" data-theme-option="things">Things</button>
        </div>
        <div id="clock">--:--</div>
      </div>
    </header>

    <div class="container">
      <div class="landing-cards">
        <a href="premade.html" class="landing-card">
          <!-- <div class="card-eyebrow">PREMADE</div> -->
          <div class="card-title">Premade</div>
          <div class="card-desc">Follow the plan.</div>
          <span class="card-arrow">→</span>
        </a>
        <a href="builder.html" class="landing-card">
          <!-- <div class="card-eyebrow">BUILD</div> -->
          <div class="card-title">Custom</div>
          <div class="card-desc">Mix &amp; match your own.</div>
          <span class="card-arrow">→</span>
        </a>
        <a href="routines.html" class="landing-card">
          <div class="card-title">Routines</div>
          <div class="card-desc">Daily routines and stretches.</div>
          <span class="card-arrow">→</span>
        </a>
      </div>
    </div>

    <button class="contact-btn" onclick="openContact()">Contact</button>

    <div
      class="contact-overlay"
      id="contact-overlay"
      onclick="closeContact(event)"
    >
      <div class="contact-modal">
        <div class="contact-header">
          <span class="contact-title">Get in touch</span>
          <button class="contact-close" onclick="closeContact()">×</button>
        </div>
        <form id="contact-form" onsubmit="submitContact(event)">
          <input
            type="hidden"
            name="access_key"
            value="8ed04ea0-6265-4629-af50-b87884f7a27f"
          />
          <input type="hidden" name="subject" value="KINETIC — Contact" />
          <input
            class="contact-input"
            type="text"
            name="name"
            placeholder="your name"
            required
            autocomplete="off"
          />
          <input
            class="contact-input"
            type="email"
            name="email"
            placeholder="your email"
            required
            autocomplete="off"
          />
          <textarea
            class="contact-input contact-textarea"
            name="message"
            placeholder="message"
            required
          ></textarea>
          <button class="contact-submit" type="submit">send →</button>
        </form>
        <div class="contact-success" id="contact-success">message sent ✓</div>
      </div>
    </div>

    <script>
      function updateClock() {
        var now = new Date();
        document.getElementById("clock").textContent =
          String(now.getHours()).padStart(2, "0") +
          ":" +
          String(now.getMinutes()).padStart(2, "0");
      }
      updateClock();
      setInterval(updateClock, 10000);

      function openContact() {
        document.getElementById("contact-overlay").classList.add("open");
      }
      function closeContact(e) {
        if (
          !e ||
          e.target === document.getElementById("contact-overlay") ||
          !e.target.closest
        ) {
          document.getElementById("contact-overlay").classList.remove("open");
        }
      }
      async function submitContact(e) {
        e.preventDefault();
        var form = document.getElementById("contact-form");
        var btn = form.querySelector(".contact-submit");
        btn.textContent = "sending...";
        btn.disabled = true;
        var res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: new FormData(form),
        });
        if (res.ok) {
          form.style.display = "none";
          document.getElementById("contact-success").style.display = "block";
        } else {
          btn.textContent = "try again";
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knee — Now</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo" id="app-title">KNEE / NOW</div>
      <div id="clock">--:--</div>
    </header>

    <div class="container">
      <div class="slot-label" id="slot-label">detecting slot...</div>
      <div class="slot-title" id="slot-title">—</div>

      <div class="tabs" id="tab-container"></div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="prog-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="prog-text">0 / 0 done</div>
      </div>

      <div id="exercise-list"></div>

      <div id="avoid-section"></div>

      <div class="signal" id="signal-section"></div>

      <button class="reset-btn" onclick="resetDone()">↺ reset session</button>
    </div>

    <script>
      const CONFIG = {
        title: "KNEE / NOW",
        bodyPart: "knee",
        signals: [
          { label: "Stop if", text: "Sharp anterior pain" },
          { label: "Stop if", text: "Swelling next day ↑" },
          { label: "Ice after", text: "10–15 min" },
        ],
      };

      const SLOTS = {
        morning: {
          label: "Morning / Daily",
          title: "Morning Routine",
          tabLabel: "Morning",
          autoSlotHours: [0, 10],
          exercises: [
            { name: "Pushups", spec: "3 × max" },
            { name: "Pull-ups", spec: "3 × max" },
            { name: "Plank", spec: "3 × 30–60s" },
            { name: "Neck work", spec: "2 × 10 each" },
            {
              name: "Quad Sets",
              spec: "2 × 10 · 5s hold",
              notes: "Press back of knee into floor. No leg lift.",
            },
            {
              name: "Light TKE (band)",
              spec: "2 × 15",
              notes: "Slow, full lockout — avoid snapping into extension.",
            },
          ],
          avoid: [
            "Explosive movements",
            "Deep knee bending (joint stiff early AM)",
          ],
        },
        "rehab-a": {
          label: "Rehab A — 3×/week",
          title: "Rehab A",
          tabLabel: "Rehab A",
          autoSlotHours: [10, 24],
          exercises: [
            {
              name: "Quad Sets",
              spec: "3×10 · 5–10s hold",
              notes: "Press back of knee into floor. No leg lift.",
            },
            {
              name: "TKE (band)",
              spec: "3×12–15 · slow lockout",
              notes: "Slow, full lockout — avoid snapping into extension.",
            },
            {
              name: "Straight Leg Raises",
              spec: "3×10–12 · 2s up/down",
              notes: "Lock knee fully before lifting. Toes pointed up.",
            },
            {
              name: "Glute Bridge",
              spec: "3×12–15 · 2s squeeze",
              notes: "Drive through heels. Do not hyperextend lower back at top.",
            },
            {
              name: "Side-Lying Hip Abduction",
              spec: "2–3×12–15",
              notes: "Keep pelvis stacked, do not rotate forward during lift.",
            },
          ],
          avoid: [],
        },
        "leg-day": {
          label: "Leg Day — Rehab B",
          title: "Leg Day B",
          tabLabel: "Leg Day B",
          autoSlotHours: null,
          exercises: [
            {
              name: "Shallow Wall Sit",
              spec: "4×20–30s · 30–45° only",
              notes: "Back flat against wall. Stop at 45° — do not push past comfort.",
            },
            {
              name: "Step-Ups (low)",
              spec: "3×8–10 / leg · no push-off",
              notes: "Lead leg only. No push-off from trailing foot.",
            },
            {
              name: "Romanian Deadlift",
              spec: "3×8–10 · hip-dominant",
              notes: "Hinge at hips, soft knee bend. Bar stays close to legs.",
            },
            { name: "Hamstring Curl", spec: "3×10–12" },
            { name: "Calf Raises", spec: "3×12–15" },
          ],
          avoid: [
            "Deep squats",
            "Lunges past ~60°",
            "Heavy/full-range leg extensions",
            "Slant board / knees-over-toes",
          ],
        },
      };

      const TODAY = new Date().toISOString().slice(0, 10);
      const STORAGE_KEY = `${CONFIG.bodyPart}-done-${TODAY}`;
      let currentSlot = null;
      let doneState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

      function saveDoneState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(doneState));
      }

      function getAutoSlot() {
        const h = new Date().getHours();
        for (const [slug, s] of Object.entries(SLOTS)) {
          if (
            s.autoSlotHours &&
            h >= s.autoSlotHours[0] &&
            h < s.autoSlotHours[1]
          ) {
            return slug;
          }
        }
        return Object.keys(SLOTS)[0];
      }

      function renderTabs() {
        document.getElementById("tab-container").innerHTML = Object.entries(
          SLOTS,
        )
          .map(
            ([slug, s]) =>
              `<div class="tab" data-slot="${slug}" onclick="setSlot('${slug}')">${s.tabLabel}</div>`,
          )
          .join("");
      }

      function renderSignals() {
        document.getElementById("signal-section").innerHTML = CONFIG.signals
          .map(
            (sig) =>
              `<div class="signal-item"><strong>${sig.label}</strong>${sig.text}</div>`,
          )
          .join("");
      }

      function setSlot(slug) {
        currentSlot = slug;
        const s = SLOTS[slug];
        document.getElementById("slot-label").textContent = s.label;
        document.getElementById("slot-title").textContent = s.title;

        document.querySelectorAll(".tab").forEach((t) => {
          t.classList.toggle("active", t.dataset.slot === slug);
        });

        renderExercises(slug);
        renderAvoid(slug);
        updateProgress(slug);
      }

      function renderExercises(slug) {
        const s = SLOTS[slug];
        document.getElementById("exercise-list").innerHTML = s.exercises
          .map((ex, i) => {
            const key = slug + "-" + i;
            const isDone = !!doneState[key];
            return `
        <div class="block">
          <div class="ex ${isDone ? "done" : ""}" id="ex-${key}">
            <div class="ex-head" onclick="toggleDone('${key}')">
              <span class="ex-num">${String(i + 1).padStart(2, "0")}</span>
              <span class="ex-name">${ex.name}</span>
              <span class="ex-spec">${ex.spec}</span>
              <button class="ex-done-btn" aria-label="mark done">✓</button>
            </div>
            ${ex.notes ? `<div class="ex-notes">${ex.notes}</div>` : ""}
          </div>
        </div>`;
          })
          .join("");
      }

      function renderAvoid(slug) {
        const s = SLOTS[slug];
        const el = document.getElementById("avoid-section");
        if (!s.avoid.length) {
          el.innerHTML = "";
          return;
        }
        el.innerHTML = `<div class="avoid-block">
      <div class="avoid-label">avoid today</div>
      ${s.avoid.map((a) => `<div class="avoid-item">${a}</div>`).join("")}
    </div>`;
      }

      function toggleDone(key) {
        doneState[key] = !doneState[key];
        saveDoneState();
        const exEl = document.getElementById("ex-" + key);
        exEl.classList.toggle("done", doneState[key]);
        updateProgress(currentSlot);
      }

      function updateProgress(slug) {
        const s = SLOTS[slug];
        const total = s.exercises.length;
        const done = s.exercises.filter(
          (_, i) => doneState[slug + "-" + i],
        ).length;
        const pct = total ? (done / total) * 100 : 0;
        document.getElementById("prog-fill").style.width = pct + "%";
        document.getElementById("prog-text").textContent = `${done} / ${total} done`;
      }

      function resetDone() {
        if (!currentSlot) return;
        const s = SLOTS[currentSlot];
        s.exercises.forEach((_, i) => {
          delete doneState[currentSlot + "-" + i];
        });
        saveDoneState();
        renderExercises(currentSlot);
        updateProgress(currentSlot);
      }

      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = h + ":" + m;
      }

      // Init
      document.getElementById("app-title").textContent = CONFIG.title;
      document.title = CONFIG.title.replace(" / ", " — ");
      renderTabs();
      renderSignals();
      updateClock();
      setInterval(updateClock, 10000);
      setSlot(getAutoSlot());
    </script>
  </body>
</html>

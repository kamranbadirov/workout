<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KINETIC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing">
    <header>
      <div class="logo">KINETIC</div>
      <div id="clock">--:--</div>
    </header>

    <div class="container">
      <div class="landing-cards">
        <a href="premade.html" class="landing-card">
          <!-- <div class="card-eyebrow">PREMADE</div> -->
          <div class="card-title">Premade</div>
          <div class="card-desc">Follow the plan.</div>
          <span class="card-arrow">→</span>
        </a>
        <a href="builder.html" class="landing-card">
          <!-- <div class="card-eyebrow">BUILD</div> -->
          <div class="card-title">Custom</div>
          <div class="card-desc">Mix &amp; match your own.</div>
          <span class="card-arrow">→</span>
        </a>
      </div>
    </div>

    <script>
      function updateClock() {
        var now = new Date();
        document.getElementById("clock").textContent =
          String(now.getHours()).padStart(2, "0") + ":" +
          String(now.getMinutes()).padStart(2, "0");
      }
      updateClock();
      setInterval(updateClock, 10000);
    </script>
  </body>
</html>
